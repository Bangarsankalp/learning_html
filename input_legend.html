<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Contact form</legend>
        <form>
            <label> Enter name</label>
            <input type="text" placeholder="Enter name" />
            <br><br>

            <label>Enter Email</label>
            <input type="email" placeholder="Enter the email" />
            <br><br>
            <label> Aadhar number</label>
            <input type="number" placeholder="Enter the aadhar number" />
            <br><br>
            <label>Choose Circle</label>
            <input type="checkbox" checked />Mumbai
             <input type="checkbox" />Delhi
              <input type="checkbox" />Goa
               <input type="checkbox"  />Pune
               <br> <br>
               <label>Select Gender</label>
               <input type="radio" name="Gender" />Male
               <input type="radio" name="Gender" />Female
               <input type="radio" name="Gender" />other
               <br> <br>
               <label>Select  color</label>
               <input type="color"/>
               <br><br>
               <label>Select range</label>
               <input type="range"/>

               <br><br>
               <label>upload docs</label>
               <input type="file"/>
               <br><br>
               <label>upload docs</label>
               <input type="file" multiple/>
               <br><br>
               <label>search</label>
               <input type="search" placeholder="type here to serach"/>
               <br>
               <br>
               <label>Enter URL</label>
               <input type="tel" placeholder="http://example.com"/>
               <br>
               <br>
               <label>Enter telephone</label>
               <input type="tel" placeholder="158412685412"/>
               <br>
               <br>
               <label>Select City</label>
               <select>
                <option>Choose your city</option>
                <option>mumbai</option>
                <option>pune</option>
                <option>Nashik</option>
               </select>
               <br>
               <br>
               <label>Enter Address</label>
               <textarea rows="5" cols="30"></textarea>
               <br><br>
               <input type="submit" value="submit form"/>
               <input type="button" value="submit from"/>
               <input type="reset" value="reset form"/>
        </form>
    </fieldset>
</body>
</html>
